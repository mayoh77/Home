<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mayoh77</title>
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ─────────────────────────────────────────────
    //  🔧 FIREBASE KONFIGURATION — hier anpassen!
    // ─────────────────────────────────────────────
    const firebaseConfig = {
      apiKey:            "AIzaSyAHrGPgAy9mpZCKkFRkvmxy-jcXP1g8WPA",
      authDomain:        "mayoh-home.firebaseapp.com",
      projectId:         "mayoh-home",
      storageBucket:     "mayoh-home.firebasestorage.app",
      messagingSenderId: "288518264725",
      appId:             "1:288518264725:web:c58f02eee57d388a17c89c"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    let currentUser = null;
    const sitesMap = {}; // global store: id → site data

    // ── Auth State ────────────────────────────────
    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        document.getElementById("admin-bar").classList.add("visible");
        document.getElementById("admin-avatar").src = user.photoURL || "";
        document.getElementById("admin-name").textContent = user.displayName || user.email;
        document.getElementById("btn-login").style.display  = "none";
        document.getElementById("btn-logout").style.display = "flex";
        document.getElementById("btn-add").style.display    = "flex";
        loadSites();
      } else {
        document.getElementById("admin-bar").classList.remove("visible");
        document.getElementById("btn-login").style.display  = "flex";
        document.getElementById("btn-logout").style.display = "none";
        document.getElementById("btn-add").style.display    = "none";
        loadSites();
      }
    });

    // ── Google Login ──────────────────────────────
    window.googleLogin = async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        console.error(e);
        showToast("Login fehlgeschlagen: " + e.message, "error");
      }
    };

    window.googleLogout = async () => {
      await signOut(auth);
      showToast("Abgemeldet.");
    };

    // ── Load Sites ────────────────────────────────
    window.loadSites = async () => {
      const grid = document.getElementById("sites-grid");
      const empty = document.getElementById("empty-state");
      const failed = document.getElementById("error-state");
      empty.style.display = "none";
      failed.style.display = "none";
      grid.innerHTML = '<div class="dot-loader" role="status" aria-label="Lädt"><i></i><i></i><i></i></div>';

      try {
        const q = query(collection(db, "sites"), orderBy("order", "asc"));
        const snap = await getDocs(q);
        const sites = [];
        grid.innerHTML = "";
        snap.forEach(d => { const s = { id: d.id, ...d.data() }; sitesMap[d.id] = s; sites.push(s); });

        if (sites.length === 0) {
          empty.style.display = "flex";
        } else {
          empty.style.display = "none";
          sites.forEach((site, i) => {
            const card = createCard(site, i);
            grid.appendChild(card);
          });
        }
      } catch (e) {
        console.error(e);
        grid.innerHTML = "";
        failed.style.display = "flex";
      }
    };

    // ── Generatives Punktmuster als Cover ─────────
    function dotCover(seed) {
      let h = 7;
      for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      const cols = 32, rows = 18;
      let out = "";
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          h = (Math.imul(h, 1664525) + 1013904223) >>> 0;
          const on = (h >>> 24) < 36;
          out += `<circle cx="${c * 10 + 5}" cy="${r * 10 + 5}" r="1.6"${on ? ' class="on"' : ""}/>`;
        }
      }
      return `<svg class="dot-cover" viewBox="0 0 ${cols * 10} ${rows * 10}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${out}</svg>`;
    }

    // ── Create Card DOM ───────────────────────────
    function createCard(site, index) {
      const card = document.createElement("article");
      card.className = "site-card";
      card.style.animationDelay = `${index * 80}ms`;

      card.innerHTML = `
        <a href="${site.url}" target="_blank" rel="noopener" class="card-link" aria-label="${site.title}">
          <div class="card-preview">
            ${site.thumbnail
              ? `<img src="${site.thumbnail}" alt="" class="card-thumb" loading="lazy" />`
              : `<div class="card-thumb-placeholder">${dotCover(site.title || site.id)}</div>`
            }
            <div class="card-overlay">
              <svg class="visit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/>
              </svg>
            </div>
          </div>
          <div class="card-body">
            <div class="card-tag">${site.category || "Website"}</div>
            <h3 class="card-title">${site.title}</h3>
            ${site.description ? `<p class="card-desc">${site.description}</p>` : ""}
            <div class="card-url">${prettifyUrl(site.url)}</div>
          </div>
        </a>
        ${currentUser ? `
          <div class="card-actions">
            <button class="action-btn edit-btn" onclick="openEditModal('${site.id}')" title="Bearbeiten" aria-label="Bearbeiten">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="action-btn delete-btn" onclick="deleteSite('${site.id}')" title="Löschen" aria-label="Löschen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                <path d="M10 11v6M14 11v6M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
              </svg>
            </button>
          </div>
        ` : ""}
      `;
      return card;
    }

    // ── Add / Edit Site ───────────────────────────
    window.saveSite = async () => {
      const id    = document.getElementById("modal-id").value;
      const data  = {
        title:       document.getElementById("field-title").value.trim(),
        url:         document.getElementById("field-url").value.trim(),
        description: document.getElementById("field-desc").value.trim(),
        category:    document.getElementById("field-cat").value.trim(),
        thumbnail:   document.getElementById("field-thumb").value.trim(),
        order:       parseInt(document.getElementById("field-order").value) || 0,
      };

      if (!data.title || !data.url) {
        showToast("Titel und URL sind Pflichtfelder.", "error");
        return;
      }

      const btn = document.getElementById("modal-save-btn");
      btn.textContent = "Speichert …";
      btn.disabled = true;

      try {
        if (id) {
          await updateDoc(doc(db, "sites", id), data);
          showToast("Website aktualisiert ✓");
        } else {
          await addDoc(collection(db, "sites"), data);
          showToast("Website hinzugefügt ✓");
        }
        closeModal();
        loadSites();
      } catch (e) {
        showToast("Fehler: " + e.message, "error");
      } finally {
        btn.textContent = "Speichern";
        btn.disabled = false;
      }
    };

    window.deleteSite = async (id) => {
      if (!confirm("Website wirklich löschen?")) return;
      try {
        await deleteDoc(doc(db, "sites", id));
        showToast("Gelöscht.");
        loadSites();
      } catch (e) {
        showToast("Fehler: " + e.message, "error");
      }
    };

    window.openEditModal = (id) => {
      const site = sitesMap[id] || {};
      document.getElementById("modal-title-heading").textContent = "Website bearbeiten";
      document.getElementById("modal-id").value            = id;
      document.getElementById("field-title").value         = site.title || "";
      document.getElementById("field-url").value           = site.url || "";
      document.getElementById("field-desc").value          = site.description || "";
      document.getElementById("field-cat").value           = site.category || "";
      document.getElementById("field-thumb").value         = site.thumbnail || "";
      document.getElementById("field-order").value         = site.order || 0;
      openModal();
    };

  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ═══════════════════  HEADER  ═══════════════════ -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo label">Portfolio</div>

    <nav class="header-nav">
      <button id="btn-login" class="btn btn-ghost" onclick="googleLogin()" aria-label="Anmelden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/>
        </svg>
        <span>Anmelden</span>
      </button>
      <button id="btn-add" class="btn btn-filled" onclick="openAddModal()" style="display:none" aria-label="Hinzufügen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" width="20" height="20">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Hinzufügen</span>
      </button>
      <button id="btn-logout" class="btn btn-ghost" onclick="googleLogout()" style="display:none" aria-label="Abmelden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
        <span>Abmelden</span>
      </button>
    </nav>
  </div>

  <!-- Admin-Zeile: roter Punkt = aktiv -->
  <div id="admin-bar" class="admin-bar">
    <span class="dot" aria-hidden="true"></span>
    <span class="label admin-pill">Admin</span>
    <img id="admin-avatar" src="" alt="" class="admin-avatar" />
    <span class="admin-name-wrap"><strong id="admin-name"></strong></span>
  </div>
</header>

<!-- ═══════════════════  HERO  ═══════════════════ -->
<section class="hero">
  <h1 class="hero-title"><em>Mayoh77</em></h1>
</section>

<!-- ═══════════════════  GRID  ═══════════════════ -->
<main class="main-content">
  <div id="sites-grid" class="sites-grid"></div>

  <div id="empty-state" class="empty-state" style="display:none">
    <div class="empty-icon" aria-hidden="true">00</div>
    <h3>Noch keine Projekte</h3>
    <p>Melde dich an und füge deine erste Website hinzu.</p>
  </div>

  <div id="error-state" class="error-state" style="display:none">
    <h3><span class="dot" aria-hidden="true"></span>Projekte nicht erreichbar</h3>
    <p>Die Verbindung hat nicht geklappt. Versuche es gleich noch einmal.</p>
    <button class="btn btn-ghost" onclick="loadSites()">Neu laden</button>
  </div>
</main>

<!-- ═══════════════════  FOOTER  ═══════════════════ -->
<footer class="site-footer">
  <div class="footer-inner label">Mayoh77</div>
</footer>

<!-- ═══════════════════  MODAL  ═══════════════════ -->
<div id="modal-overlay" class="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 id="modal-title-heading" class="modal-heading">Website hinzufügen</h2>
      <button class="modal-close" onclick="closeModal()" aria-label="Schließen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <input type="hidden" id="modal-id" />

    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Titel <span class="req">*</span></label>
        <input id="field-title" class="form-input" type="text" placeholder="Mein Projekt" />
      </div>
      <div class="form-group">
        <label class="form-label">URL <span class="req">*</span></label>
        <input id="field-url" class="form-input" type="url" placeholder="https://beispiel.de" />
      </div>
      <div class="form-group">
        <label class="form-label">Beschreibung</label>
        <textarea id="field-desc" class="form-input form-textarea" placeholder="Kurze Beschreibung des Projekts…" rows="3"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Kategorie</label>
          <input id="field-cat" class="form-input" type="text" placeholder="z. B. E-Commerce" />
        </div>
        <div class="form-group">
          <label class="form-label">Reihenfolge</label>
          <input id="field-order" class="form-input" type="number" placeholder="0" value="0" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Vorschaubild-URL <span class="hint">(optional)</span></label>
        <input id="field-thumb" class="form-input" type="url" placeholder="https://…/screenshot.jpg" />
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button id="modal-save-btn" class="btn btn-filled" onclick="saveSite()">Speichern</button>
    </div>
  </div>
</div>

<!-- ═══════════════════  TOAST  ═══════════════════ -->
<div id="toast" class="toast" role="alert" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
